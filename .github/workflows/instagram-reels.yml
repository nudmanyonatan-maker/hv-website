name: Home Value Instagram Reels

# Runs on this repo — no Cursor Automations UI needed.
# Uses CURSOR_API_KEY (preferred) or COMPOSIO_API_KEY (fallback).
#
# Required: FULLVENDOR_TOKEN
# Plus one of: CURSOR_API_KEY | COMPOSIO_API_KEY

on:
  schedule:
    - cron: '0 13 * * *'   # 9am ET
    - cron: '0 16 * * *'   # 12pm ET
    - cron: '0 19 * * *'   # 3pm ET
    - cron: '0 22 * * *'   # 6pm ET
    - cron: '0 1 * * *'    # 9pm ET
  workflow_dispatch:

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        working-directory: homevalue_content_system
        run: npm ci

      - name: Setup music library
        working-directory: homevalue_content_system
        run: node scripts/setup-music.mjs

      - name: Publish next reel
        working-directory: homevalue_content_system
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          FULLVENDOR_TOKEN: ${{ secrets.FULLVENDOR_TOKEN }}
        run: node scripts/ci-publish.mjs
