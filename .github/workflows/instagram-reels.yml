name: Home Value Instagram Reels

# Primary automation — runs ON this repo via GitHub Actions (no Cursor Automations UI needed).
# Launches a Cursor Cloud Agent via API; agent publishes via Composio MCP.
#
# Required secrets:
#   CURSOR_API_KEY     — cursor.com/dashboard → API Keys
#   FULLVENDOR_TOKEN   — FullVendor API key

on:
  schedule:
    - cron: '0 13 * * *'   # 9am ET
    - cron: '0 16 * * *'   # 12pm ET
    - cron: '0 19 * * *'   # 3pm ET
    - cron: '0 22 * * *'   # 6pm ET
    - cron: '0 1 * * *'    # 9pm ET
  workflow_dispatch:

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Launch Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FULLVENDOR_TOKEN: ${{ secrets.FULLVENDOR_TOKEN }}
        run: node homevalue_content_system/scripts/trigger-cursor-agent.mjs
